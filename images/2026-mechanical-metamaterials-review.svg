<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc">
<title id="title">Structural design of mechanical metamaterials</title><desc id="desc">Original conceptual illustration based on Zhang et al., Acta Mechanica Solida Sinica (2026), DOI 10.1007/s10338-026-00843-5. Re-entrant lattices, chiral unit cells and folded sheets illustrate the geometry-to-mechanism-to-function framework. Cells are schematic examples, not reproduced experimental specimens or computed data.</desc>
