<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" role="img" aria-labelledby="title desc">
<title id="title">Tissue-adhesive hydrogel optical fiber</title><desc id="desc">Original schematic based on Chen et al., Nature Communications 17, 8101 (2026), DOI 10.1038/s41467-026-74831-1. A PHEMA core with a lower-index adhesive cladding delivers light while conforming to pancreatic tissue; optogenetic vagal activation stimulates insulin secretion. Refractive indices are published mean values. Anatomy is schematic.</desc>
